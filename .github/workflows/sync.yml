name: Sync (manual)

# 관리자 페이지의 "지금 다시 동기화" 버튼이 workflow_dispatch로 부른다. Actions 탭에서 직접 실행해도 된다.
# 평소 동기화는 Railway Cron(15분마다)이 하고, 겹치면 나중에 시작한 쪽이 sync_state `_running` 잠금을 보고 건너뛴다.
on:
  workflow_dispatch:
    inputs:
      full:
        description: 마지막 동기화 시각을 무시하고 전부 다시 반영(--full)
        type: boolean
        default: false

concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  # 바뀐 게 있으면 GITHUB_TOKEN으로 repository_dispatch(content-updated)를 보내 사이트를 다시 빌드한다.
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm(packageManager)과 Node.js(devEngines.runtime)를 package.json에서 읽어 설치하고 pnpm install까지 한다.
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true
      - name: Notion → Postgres · R2
        # API로 부르면 입력이 문자열 'true'로 올 수 있어 두 경우를 다 본다.
        run: pnpm --filter @luna/sync start ${{ (inputs.full == true || inputs.full == 'true') && '--full' || '' }}
        env:
          SYNC_TRIGGER: admin
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_MEMBERS: ${{ secrets.NOTION_DB_MEMBERS }}
          NOTION_DB_AWARDS: ${{ secrets.NOTION_DB_AWARDS }}
          NOTION_DB_PROJECTS: ${{ secrets.NOTION_DB_PROJECTS }}
          NOTION_DB_FAQ: ${{ secrets.NOTION_DB_FAQ }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          GITHUB_DISPATCH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_DISPATCH_REPOSITORY: ${{ github.repository }}
