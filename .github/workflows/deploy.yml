name: Build & Deploy

on:
  push:
    branches: [main]
  # Railway sync 작업이 Notion 변경을 반영한 뒤 호출 (event_type: content-updated)
  repository_dispatch:
    types: [content-updated]
  # 주 1회 예약 빌드 (월요일 03:00 KST = 일요일 18:00 UTC)
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

# 같은 시점에 배포가 겹치지 않게 한다. 진행 중인 배포는 끝까지 두고 최신 요청 하나만 대기.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm(packageManager)과 Node.js(devEngines.runtime)를 package.json에서 읽어 설치하고 pnpm install까지 한다.
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true
      - run: pnpm lint
      - run: pnpm typecheck
      # 새 테이블·열이 있으면 빌드 전에 적용한다. 이미 적용된 마이그레이션은 건너뛴다.
      - name: DB 마이그레이션
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # 사진도 Postgres(image_files)에서 꺼내 dist/img/에 정적 파일로 함께 내보낸다.
      - name: Build (Postgres에서 읽어 정적 사이트 생성)
        run: pnpm build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: deploy
