name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Railway Postgres 템플릿(postgres-ssl:latest)과 같은 메이저 버전
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # pnpm(packageManager)과 Node.js(devEngines.runtime)를 package.json에서 읽어 설치하고 pnpm install까지 한다.
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true
      - name: 커밋 메시지 검사 (Conventional Commits)
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
      - name: Lint & format (Biome)
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: 마이그레이션 검증 (적용 + 스키마와 일치 여부)
        run: |
          pnpm db:migrate
          pnpm --filter @luna/db generate --name ci-drift-check
          git diff --exit-code --stat -- packages/db/drizzle || (echo "::error::schema.ts와 마이그레이션이 다릅니다. pnpm db:generate 후 커밋하세요." && exit 1)
          test -z "$(git status --porcelain packages/db/drizzle)" || (echo "::error::마이그레이션이 누락되었습니다. pnpm db:generate 후 커밋하세요." && exit 1)
      - name: Test
        run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      - name: Build
        run: pnpm build
      - name: 관리자 Worker 번들 확인
        run: pnpm --filter @luna/admin exec wrangler deploy --dry-run --outdir dist
        env:
          WRANGLER_SEND_METRICS: "false"
